# OTPilot regression corpus — BASE 1 (validated).
# Real-world messages that the extractor already handles correctly.
# Rule: no change may break any case in this file.
# One entry per message FORMAT (same sender + same template = one case).
# Personal data is anonymized and every code is replaced with random digits
# of the same length. "message" mimics what the app sees in notification mode
# (EXTRA_TEXT, then EXTRA_BIG_TEXT, joined by newlines; title excluded).

