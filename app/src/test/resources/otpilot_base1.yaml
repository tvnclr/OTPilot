# ── Synthetic guards for the context fallback ─────────────────────────────────
# Keyword present, code far from it. Numbers that are NOT codes must stay null.

- name: guard_date
  expectedCode: ~
  message: "Your verification code expires on 12/05/2026. Request a new one if needed."

- name: guard_order_amount
  expectedCode: ~
  message: "Use the code below at checkout. Order #48213 total $1299.00"

- name: guard_year_footer
  expectedCode: ~
  message: "Your code will arrive shortly. © 2026 Example Inc."

- name: guard_phone
  expectedCode: ~
  message: "Promo code applied. Questions? Call +5511912345678 or 0800 7071234"

- name: guard_time_ptbr
  expectedCode: ~
  message: "Seu código foi enviado às 14:35 de 01.11.2026"

- name: fallback_code_block_below
  expectedCode: "709214"
  message: |-
    Your security code is below. Do not share it with anyone.

    709214

    It expires in 10 minutes.

# Bare "code" that is not a sign-in code ("VS Code") and a ZIP code ~900 characters later,
# in the footer. Every GitHub email ends with this address.
- name: guard_github_footer_zip
  expectedCode: ~
  message: |-
    Your free Copilot access is ready
    Your free Copilot access is ready
    Your free Copilot access is ready user, Start here: Install Copilot for your editor (or just sign in with your GitHub account if you use VS Code). Then ask Copilot about the code youre working on. You can use Copilot in these places: IDE CLI Copilot app GitHub ( and GitHub Mobile) Need more ideas? Copy-pasteable prompts for common tasks Whats included: 2,000 code completions every month Copilot Chat, including agent mode, for questions, explanations, and fixes Manage your plan or upgrade Privacy policy • Terms of use • Contact us GitHub, Inc. • 88 Colin P Kelly Jr Street • San Francisco, CA 94107

# Qualified keyword, but the only number is far away (more than ContextFallback.MAX_DISTANCE).
- name: guard_fallback_distance
  expectedCode: ~
  message: "Your verification code was sent to the phone number on file. If you did not ask for it, someone may be trying to get into your account, so change your password and review the devices signed in to it. You can manage all of this in the security page of your account settings. Example Corp, PO Box 48213"

# A lowercase word after "código" is not a code (Claude notification, Nov 2026).
